apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plantstream.fullname" . }}
  labels:
    {{- include "plantstream.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate   # one node owns the sources and the on-disk queue
  selector:
    matchLabels:
      {{- include "plantstream.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/plant: {{ .Values.plant.yaml | sha256sum }}
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "plantstream.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "plantstream.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: plantstream
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "plantstream.fullname" . }}-env
          {{- if .Values.config.mqtt.existingSecret }}
          env:
            - name: PLANTSTREAM_MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.mqtt.existingSecret }}
                  key: username
            - name: PLANTSTREAM_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.mqtt.existingSecret }}
                  key: password
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: plant
              mountPath: /etc/plantstream
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.bridge.queue.persistence.enabled }}
            - name: queue
              mountPath: /data/queue
            {{- end }}
      volumes:
        - name: plant
          configMap:
            name: {{ include "plantstream.plantConfigMap" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.bridge.queue.persistence.enabled }}
        - name: queue
          persistentVolumeClaim:
            claimName: {{ include "plantstream.fullname" . }}-queue
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
