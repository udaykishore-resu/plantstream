# Full local stack: Mosquitto (UNS broker), Kafka in KRaft mode (cloud sink),
# OpenTelemetry Collector, plc-sim (Modbus TCP) and the plantstream edge node
# bridging MQTT → Kafka with an on-disk store-and-forward queue.
#
#   make run-full            # docker compose -f deploy/docker-compose.yaml up --build
#   curl localhost:8080/v1/tags/filler-01/latest
#   docker compose -f deploy/docker-compose.yaml exec kafka \
#     /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server kafka:9092 --topic uns.events --from-beginning --max-messages 5
name: plantstream

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports: ["1883:1883"]
    volumes:
      - ./compose/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 2 -h localhost >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./compose/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports: ["4318:4318", "8889:8889"]

  plc-sim:
    build:
      context: ..
      target: plc-sim
    ports: ["5020:5020"]

  plantstream:
    build:
      context: ..
      target: plantstream
    depends_on:
      mosquitto: { condition: service_healthy }
      kafka: { condition: service_healthy }
      plc-sim: { condition: service_started }
    ports: ["8080:8080"]
    environment:
      PLANTSTREAM_PLANT_FILE: /app/examples/plant-compose.yaml
      PLANTSTREAM_BROKER: mqtt
      PLANTSTREAM_MQTT_URL: mqtt://mosquitto:1883
      PLANTSTREAM_BRIDGE_ENABLED: "true"
      PLANTSTREAM_SINK: kafka
      PLANTSTREAM_KAFKA_BROKERS: kafka:9092
      PLANTSTREAM_KAFKA_TOPIC: uns.events
      PLANTSTREAM_QUEUE_DIR: /data/queue
      PLANTSTREAM_QUEUE_MAX_BYTES: "268435456"
      PLANTSTREAM_OTEL_ENDPOINT: otel-collector:4318
      PLANTSTREAM_LOG_LEVEL: info
    volumes:
      - ./compose/plant-compose.yaml:/app/examples/plant-compose.yaml:ro
      - queue:/data/queue

volumes:
  queue:
